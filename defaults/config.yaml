config_version: 4

# -------------------------------------------------------------------------
# IMPORTANT FOR BEGINNERS:
# 1. DO NOT remove the space after the colon (e.g., 'key: value').
# 2. DO NOT use the 'Tab' key for spacing; use the 'Space' bar only.
# 3. PORTS: Each port must be unique. If a port is used twice, the tool 
#    will crash or fail to start.
# 4. To define a list, use:
#      list_key:
#        - item1
#        - item2
#    For an empty list, use:
#      list_key: []
# -------------------------------------------------------------------------

# SETTINGS PROTECTION
# Set this to false if you do not want the tool to overwrite personal settings.
# Disabling this may block important updates or cause configuration issues.
auto_update_config: true

# These control whether the tool automatically shuts down when the live stream ends
auto_shutdown_on_live_end: true
# If auto shutdown is enabled, this value controls how many seconds to wait before shutting down after the live stream ends.
shutdown_delay_seconds: 30

# Set this to true to disable the warning about running the tool without sudo on Linux.
# WARNING: Running without sudo on Linux can cause various issues, 
# including failed updates and permission errors. 
# Only disable this warning if you are sure you understand the risks
# and have configured your system accordingly.
# (Linux only, has no effect on Windows)
no_sudo_warning: False

# =======================================================================
# SERVER HOST BIND ADDRESS
# =======================================================================
# The IP address the servers will bind to.
# Use "127.0.0.1" to allow only local access (default).
# Use "0.0.0.0" to allow access from other devices in your network.
# Use "<IP_ADDRESS>" to bind to a specific network interface.
server_host: "127.0.0.1"

# ==============================================================================
# STREAMING CONTROL METHOD SELECTION
# ==============================================================================
# Choose how this tool communicates with your streaming software.
#
# Options:
#   DCS (Direct Control System):
#     Recommended for most users.
#     Uses direct HTTP-based control and offers the best performance,
#     lowest latency, and full access to advanced features.
#     Best for software such as OBS Studio, vMix, and Streamlabs Desktop.
#
#   ICS (Interface Control System):
#     Uses the graphical user interface for control.
#     Easier to use in some cases, but slower and with fewer supported features.
#     Some features may be unavailable or may not work properly.
#     Required for software such as TikTok Live Studio and Twitch Studio.
#
# Recommendation:
#   Use DCS whenever possible for the best reliability and performance.
# ==============================================================================
control_method: DCS

# -------------------------------------------------------------------------
# MINECRAFT SERVER SETTINGS (JAVA)
# -------------------------------------------------------------------------
Java:
  # RAM allocation (Memory). 'G' stands for Gigabytes.
  # Using the same value for Xms and Xmx is recommended for most users.
  # Xms: Initial memory | Xmx: Maximum memory.
  Xms: 4G
  Xmx: 4G

  # Default Minecraft server port.
  Port: 25565

# -------------------------------------------------------------------------
# REMOTE CONTROL (RCON)
# -------------------------------------------------------------------------
RCON:
  # Enable remote console access.
  # Disable only if you are sure you do not need it.
  Enable: true

  # Strongly recommended: change this password before using the server publicly.
  Password: ABC1234

  # Default RCON port.
  Port: 25575

# -------------------------------------------------------------------------
# TIKTOK LIVE INTEGRATION
# -------------------------------------------------------------------------
TikTok:
  # TikTok username to track.
  User: your_tiktok_username

  # Time to wait before reconnecting after a lost connection.
  ReconnectDelaySeconds: 30

# -------------------------------------------------------------------------
# LIKE GOAL / ENGAGEMENT TRIGGERS
# -------------------------------------------------------------------------
Gifts:
  # Set the autosave interval for the gift_revenue_log.jsonl file in seconds.
  # This file is used to log estimated revenue from gifts.
  autosave_interval_seconds: 60
  # Like-based triggers.
  like_triggers:
    - id: likes_standard
      every: 100
      function: likes
      payload: Community
      enable: true

    - id: likes_100k
      every: 100_000
      function: like_2
      payload: Community
      enable: true

  # Web server port used for the OBS overlay.
  LIKE_GOAL_PORT: 9797

  # How random_included and random_exclude work:
  #
  #   - If BOTH lists are empty:
  #       → All triggers are allowed (use with caution).
  #
  #   - If ONLY random_exclude is set:
  #       → All triggers are allowed EXCEPT those in random_exclude.
  #
  #   - If ONLY random_included is set:
  #       → ONLY triggers in random_included are allowed.
  #
  #   - If BOTH are set:
  #       → A trigger must be in random_included AND NOT in random_exclude.
  #       → random_exclude can override (block) entries from random_included.

  # random_included:
  # Only these triggers can be selected by $random.
  # If empty, all triggers are allowed (see rules above).
  #
  # Examples:
  #   "gift_1" → allows only "gift_1" to be selected
  #   ["gift_1", "gift_2"] → allows only these two
  random_included: []

  # random_exclude:
  # These triggers will NEVER be selected by $random.
  #
  # Note:
  #   Triggers that contain "$random" are automatically excluded
  #   to prevent recursion.
  #
  # Examples:
  #   "likes" → will never be selected
  #   ["likes", "follow"] → both are always excluded
  random_exclude:
    - likes
    - like_2
    - follow
    - join
    - comment

# -------------------------------------------------------------------------
# COMMENT COMMANDS
# -------------------------------------------------------------------------
# Allows viewers to send real Minecraft commands by writing a comment
# that starts with a specific prefix character.
# Example: If prefix is "#" and a viewer writes "#say Hello", the command
# "say Hello" will be sent directly to the Minecraft server via RCON.
#
# !!! WARNING !!!
# This feature sends raw commands to your Minecraft server.
# Anyone with the required role can execute ANY command unless you
# restrict them with a Whitelist or Blacklist.
# It is STRONGLY recommended to use a Whitelist when AllowedRoles
# includes "all", "fanclub", or "superfan".
CommentCommands:
  # Enable or disable this feature.
  Enable: false

  # The character that must appear at the start of a comment to be recognized as a command.
  # Most characters can be used as a prefix,
  # but some (like !) may not work reliably in all environments.
  # The # prefix is fully supported and has been tested to work without problems.
  # Example: Prefix: "#"  →  #say Hello
  # will trigger the command.
  Prefix: "#"

  # Who is allowed to use comment commands.
  # Available roles: all, moderator, superfan, fanclub
  # Use "all" to allow every viewer.
  # You can combine multiple roles, e.g. moderator + superfan.
  AllowedRoles:
    - moderator
    - superfan

  # How Whitelist and Blacklist interact:
  #
  #   Whitelist empty, Blacklist empty:
  #     ALL commands are allowed. Use with caution!
  #
  #   Whitelist empty, Blacklist filled:
  #     All commands are allowed EXCEPT those in the Blacklist.
  #     Example: Blacklist has "op" → "op Notch" is blocked, everything else works.
  #
  #   Whitelist filled, Blacklist empty:
  #     ONLY commands in the Whitelist are allowed, everything else is blocked.
  #     Example: Whitelist has "say" → only "say ..." works.
  #
  #   Both filled:
  #     A command must be in the Whitelist AND NOT in the Blacklist to pass.
  #     The Blacklist can be used to block specific entries from the Whitelist.

  # Whitelist: Only commands starting with these base words are allowed.
  # If the list is empty, all commands are allowed (see above).
  # Only the first word of the comment is checked.
  # Example: "say" allows "say Hello", "say Test", etc.
  # Example: "give" allows "give @a diamond 1", "give @p sword 1", etc.
  Whitelist:
    - say
    - give

  # Blacklist: Commands starting with these base words are always blocked.
  # Only the first word of the comment is checked.
  # Example: "op" blocks "op", "op Notch", etc.
  Blacklist:
    - op
    - deop
    - stop
    - ban
    - kick
    - whitelist

# -------------------------------------------------------------------------
# SYSTEM & CONSOLE CONTROL
# -------------------------------------------------------------------------
# Changing these settings can affect startup behavior and process visibility.
Console:
  # Controls which windows are shown during startup:
  #
  # Level 0: Off
  #   Hides everything, including GUI windows.
  #
  # Level 1: Silent
  #   Hides console windows, but keeps GUI features active.
  #
  # Level 2: Standard
  #   Shows only the main applications.
  #
  # Level 3: Advanced
  #   Also shows background services.
  #
  # Level 4: Debug
  #   Shows all enabled processes.
  #
  # Level 5: Override
  #   Shows every process, even if enable is false.
  #   Intended for debugging only.
  log_level: 2

  # Main console window visibility.
  visible: true

  # Process handling:
  # true  = keep the script running so typing 'exit' closes everything cleanly
  # false = start programs and exit immediately
  allow_close: true

# -------------------------------------------------------------------------
# MODULES
# -------------------------------------------------------------------------

# WEB INTERFACE
GUI:
  # Enable the web-based dashboard for server management.
  Enable: false
  Port: 5000

# UPDATER
Update:
  # Automatically check for and install tool updates.
  Enable: true

# MINECRAFT SERVER API
MinecraftServerAPI:
  Enable: true

  # API and web server ports.
  APIPort: 7000
  WebServerPort: 7777
  WebServerPortTimer: 7878
  DEATHCOUNTER_PORT: 7979

# OVERLAY TOOLS
WinCounter:
  Enable: true
  WebServerPort: 8080

Overlaytxt:
  Enable: true
  Port: 5005

  # Controls how new overlay messages are handled when a previous
  # message is still on screen.
  #
  # overwrite:
  #   The new message immediately replaces the current one.
  #   Use this if you only care about the latest event.
  #
  # queue:
  #   Messages are queued and shown one after another.
  #   Each message stays for its full duration before the next one appears.
  #   Use this if every notification matters (e.g. follower names).
  #
  #   WARNING: In queue mode, messages can pile up during busy streams.
  #   If many events fire at once, the queue may take a long time to clear
  #   and viewers will see outdated notifications.
  DisplayMode: overwrite

  # Fade-in and fade-out animation duration in milliseconds.
  # These are NOT included in the Duration value from >>commands.
  # Example: with FadeIn: 500, FadeOut: 500 and a Duration of 3,
  # the total visible time is 0.5s + 3s + 0.5s = 4s.
  # Set to 0 for instant appear/disappear (no animation).
  FadeIn: 500
  FadeOut: 500

  # The number of consecutive connection failures allowed before
  # the circuit breaker triggers and temporarily blocks requests.
  MaxFails: 3

  # The duration in seconds to wait before attempting to 
  # send messages again after the MaxFails limit is reached.
  Cooldown: 10

  # A list of available overlay instances. 
  # Each 'name' creates a unique endpoint and can be opened 
  # as a separate window or OBS source.
  # URL format: http://127.0.0.1:PORT/?overlay=NAME
  # Replace PORT with the configured port number and NAME with the overlay name.
  Overlays:
    - name: "default"

# STREAM TIMER
Timer:
  Enable: true

  # Initial timer value in minutes.
  StartTime: 10

# DEATH COUNTER
DeathCounter:
  Enable: true

LikeGoal:
  Enable: true
  # Text shown above the like goal progress bar.
  DisplayText: Like Goal
  # Number of likes needed to reach the first goal.
  # You can use underscores for readability (e.g., 100_000 instead of 100000).
  # Do not use dots or commas (100.000 and 100,000 will not work).
  InitialGoal: 100_000
  # Controls what happens after a goal is reached.
  #
  # GoalMultiplier: 0
  #   Reset mode. Likes reset to 0 and the goal starts over.
  #   Example with InitialGoal 100_000:
  #   100_000 reached → reset to 0 → 100_000 reached → reset to 0 → ...
  #
  # GoalMultiplier: 1
  #   Step mode. The goal increases by InitialGoal each time.
  #   Example with InitialGoal 100_000:
  #   100_000 → 200_000 → 300_000 → 400_000 → ...
  #
  # GoalMultiplier: 2 (or higher)
  #   Multiply mode. The goal is multiplied by this value each time.
  #   Example with InitialGoal 100_000 and GoalMultiplier 2:
  #   100_000 → 200_000 → 400_000 → 800_000 → ...
  GoalMultiplier: 1