config_version: 1.0

# =============================================================================
#  TIKTOK2MC — CONFIGURATION FILE
# =============================================================================
# This is the main configuration file for TikTok2Mc.
# Every option is explained below. Read through it carefully before your
# first stream.
#
# QUICK START — MINIMUM CHANGES REQUIRED:
#   1. Set tiktok.user to your TikTok username (without @)
#   2. Change rcon.password to something secure
#   3. Optionally adjust java.xms / java.xmx if RAM is limited
#   4. Save the file and run start.exe (Windows) or sudo ./start.bin (Linux)
#
# FORMATTING RULES (important!):
#   - Use SPACES only — never use the Tab key
#   - Always put a space after the colon:  key: value  (not key:value)
#   - For lists, use:
#       list_name:
#         - item1
#         - item2
#   - For empty lists, use:  list_name: []
#   - Lines starting with # are comments and are ignored
#
# For detailed explanations of all sections, see docs/GUIDE.md.
# =============================================================================

# ---------------------------------------------------------------------------
#  ADVANCED MODE (WEB GUI)
# ---------------------------------------------------------------------------
# This key is managed by the Web GUI and has no effect on
# the backend. Do NOT change it manually unless you know what you are doing.
config_advanced: false

# ---------------------------------------------------------------------------
#  AUTO-UPDATE CONFIG
# ---------------------------------------------------------------------------
# When enabled (recommended), new configuration options introduced by updates
# are automatically merged into your existing config.yaml.
# Existing user-defined values are preserved. Only obsolete internally-managed
# keys may be replaced or updated when required.
auto_update_config: true

# ---------------------------------------------------------------------------
#  SUDO WARNING (Linux only — has no effect on Windows)
# ---------------------------------------------------------------------------
# On Linux, running without sudo can cause update and permission issues.
# Set to false to hide this warning if you have configured your system
# to handle permissions properly without sudo.
show_sudo_warning: true

# ---------------------------------------------------------------------------
#  PORT POLICY
# ---------------------------------------------------------------------------
# Controls what happens when a required port is already in use.
#
#   auto_resolve: true   — Automatically find the next free port
#   auto_resolve: false  — Log an error and exit (safe mode)
#
#   session_only: true   — Changed ports are used only this session
#   session_only: false  — Save resolved ports to config permanently
#
#   max_offset: 10       — How many ports to try (-1 = unlimited)
port_policy:
  auto_resolve: true
  session_only: true
  max_offset: 10

# ---------------------------------------------------------------------------
#  API SERVER CONFIGURATION
# ---------------------------------------------------------------------------
# The central API server address and port.
# Interactive API documentation: http://localhost:<port>/docs
api:
  # Port that the central API server listens on (default: 29185).
  # Change this if you have another service on the same port.
  port: 29185

# ---------------------------------------------------------------------------
#  SERVER BIND ADDRESS
# ---------------------------------------------------------------------------
# Controls which network interfaces the servers listen on.
#   "127.0.0.1"  — Local access only (default, safe)
#   "0.0.0.0"    — Allow access from other devices on your network
#   "<IP>"       — Bind to a specific network interface
#
# Interactive API documentation: http://localhost:<api.port>/docs
server_host: "127.0.0.1"

# ---------------------------------------------------------------------------
#  API KEY
# ---------------------------------------------------------------------------
# Optional API key for authentication when the server is exposed beyond
# localhost.  When set, all non-localhost requests must include the header:
#
#   X-API-Key: <your_api_key>
#
# Leave empty to disable authentication (safe when server_host is 127.0.0.1).
api_key: ""

# ---------------------------------------------------------------------------
#  CONTROL METHOD
# ---------------------------------------------------------------------------
# How the tool communicates with your streaming software.
#
#   DCS (Direct Control System) — RECOMMENDED
#     Best performance, lowest latency, full feature access.
#     Use with: OBS Studio, vMix, Streamlabs Desktop.
#
#   ICS (Interface Control System)
#     Uses graphical interface. Slower, fewer features.
#     Required for: TikTok Live Studio, Twitch Studio.
control_method: DCS

# ---------------------------------------------------------------------------
#  AUTO-SHUTDOWN
# ---------------------------------------------------------------------------
# When enabled, the tool shuts down automatically after your live stream ends.
# A countdown gives you time to cancel (type 'stop' in the console).
shutdown:
  enabled: true
  delay_seconds: 30

# ===========================================================================
#  MINECRAFT SERVER (JAVA)
# ===========================================================================
java:
  # Custom Java executable path (optional).
  # If set, this path is used instead of searching the system PATH.
  # Example: "C:\Program Files\Java\jdk-21\bin\java.exe" (Windows)
  # Example: "/usr/lib/jvm/java-21-openjdk/bin/java" (Linux)
  path: ""

  # RAM allocation. 'G' = Gigabytes.
  # Using the same value for xms (initial) and xmx (maximum) is recommended.
  # Default: 4G — reduce to 2G or 1G if your system has less than 8 GB RAM.
  # Low RAM may cause lag, slow chunk loading, or server crashes.
  xms: 4G
  xmx: 4G

  # Minecraft server port (default: 25565)
  port: 25565

# ===========================================================================
#  REMOTE CONSOLE (RCON)
# ===========================================================================
# RCON allows the tool to send commands to the Minecraft server.
# IMPORTANT: Keep this enabled — disabling it breaks most functionality.
rcon:
  enabled: true

  # Set a secure password. The tool will ask you to set one on first start
  # if this is left empty.
  password: ""

  # RCON port (default: 25575)
  port: 25575

# ===========================================================================
#  TIKTOK LIVE
# ===========================================================================
tiktok:
  # Your TikTok username — without the @ symbol.
  user: your_tiktok_username

  # Seconds to wait before attempting to reconnect after a connection loss.
  reconnect_delay_seconds: 30

  # How often (in seconds) the gift revenue log file is saved to disk.
  # The log is stored at data/gift_revenue_log.jsonl.
  autosave_interval_seconds: 60

  # Follow tracking — prevents viewers from farming the follow trigger
  # by repeatedly unfollowing and refollowing.
  #
  #   mode: "all_time"  — Tracks follows across ALL streams (default).
  #                        Once a user is recorded, their future follows
  #                        are ignored — even after restarting the tool.
  #         "per_stream" — Resets the tracked list every time the tool starts.
  #                        Each stream starts fresh.
  #
  # NOTE: Only new follows that happen while the tool is running AND
  # connected to a live stream are tracked. Users who already followed
  # before the tool was running cannot be detected — they will trigger
  # a follow action the first time they follow during a tracked stream.
  follow_tracking:
    mode: "all_time"

# ===========================================================================
#  COMMENT COMMANDS
# ===========================================================================
# Let viewers send commands via TikTok chat. Each group defines its own
# prefix character, access roles, allow/deny rules, and dispatch handler.
#
# !!! SECURITY WARNING !!!
# RCON handlers send RAW commands to your Minecraft server. Anyone with the
# required role can execute any command.
# ALWAYS use deny-all mode when allowed_roles includes "all", "fanclub",
# or "superfan".
comment_commands:
  # Master switch — set to true to let viewers send commands via chat.
  # When enabled, each group below processes matching comments independently.
  enabled: false

  # Global cooldown — applies ACROSS all groups. If set to 10, someone who
  # runs $skip must wait 10 seconds before ANY command works (#op, !points, etc).
  # Each group still has its own cooldown/user_cooldown that applies on top.
  # Set to 0 to disable.
  cooldown: 0

  # Global user cooldown — like global cooldown, but per user. If set to 30, a
  # viewer who runs $skip must wait 30 seconds before THEIR NEXT command works
  # in any group. Other viewers are not affected. Set to 0 to disable.
  user_cooldown: 0

  # Define one or more command groups. Each group has its own prefix,
  # role requirements, allow/deny rules, dispatch target, and cooldowns.
  # All comments starting with the group's prefix are checked against it.
  groups:
      # ──────────────────────────────────────────────
      #  Minecraft Commands (RCON)
      # ──────────────────────────────────────────────
      # Viewers type #say Hello or #give PlayerName diamond
      # to run commands on your Minecraft server.
      #
      #   enabled       — true/false to turn this group on/off
      #   prefix        — The character that triggers this group ("#")
      #   allowed_roles — Who can use it: all, moderator, superfan, fanclub
      #   mode          — "deny-all" = only listed commands work
      #                   "allow-all" = everything works except listed commands
      #   commands         — List of base command names to allow or block
      #   commands_config  — Per-command overrides (points_cost, cooldown, roles, url, handler)
      #   handler          — "rcon" sends to Minecraft, "http" sends to a URL
      #   cooldown              — Seconds to wait between ANY command in this group (0 = off)
      #   user_cooldown         — Seconds the SAME viewer must wait before next command (0 = off)
      #   trigger_comment_event — Also fire the 'comment' trigger in actions.mca? (default: true)
    - enabled: true
      prefix: "#"
      allowed_roles:
        - moderator
        - superfan
      mode: deny-all
      commands:
        - say
        - give
      commands_config: {}
      handler: rcon
      cooldown: 0
      user_cooldown: 0
      trigger_comment_event: true

      # ──────────────────────────────────────────────
      #  Spotify Control (API Handler)
      # ──────────────────────────────────────────────
      # Viewers type $play, $pause, $skip, $volume 50, etc.
      # to control Spotify playback. Requires the Spotify plugin
      # to be configured (see the Spotify plugin's own config.yaml).
      #
      # The Spotify plugin registers its ``comment_handler`` dynamically
      # via the API (``plugin.json`` → ``comment_handler.prefix: "$"``).
      # The bridge fetches registered handlers at startup and routes
      # ``$`` commands to the plugin's command queue automatically.
      # No static ``handler`` / ``url`` fields are needed anymore.
    - enabled: true
      prefix: "$"
      allowed_roles:
        - all
      mode: deny-all
      commands:
        - play
        - pause
        - skip
        - prev
        - volume
        - save
        - repeat
        - shuffle
        - current
        - playtrack

      commands_config:
        skip:
          cooldown: 30
        prev:
          cooldown: 30
        playtrack:
          cooldown: 30
          conditional: true
        volume:
          roles:
            - moderator
      cooldown: 0
      user_cooldown: 0
      trigger_comment_event: true

# ===========================================================================
#  CONSOLE VISIBILITY
# ===========================================================================
# Controls which windows / processes are shown on screen.
# Changing these affects what you see when the tool starts.
console:
  # Visibility level:
  #   0 — Off:       Hides everything
  #   1 — Silent:    Hides console, keeps GUI and overlays (recommended)
  #   2 — Standard:  Shows main windows
  #   3 — Advanced:  Also shows background services
  #   4 — Debug:     Shows all enabled processes
  #   5 — Override:  Shows every process (even disabled ones, debugging only)
  log_level: 1

  # Show the main console window.
  visible: true

  # If true, the script stays open and typing 'exit' shuts down cleanly.
  # If false, programs start and the launcher exits immediately.
  allow_close: true

# ===========================================================================
#  MODULES — ENABLE / DISABLE INDIVIDUAL FEATURES
# ===========================================================================

# --- MINECRAFT SERVER API ---
# Handles communication between the bridge and the Minecraft server.
# Required for player death/respawn detection, datapack loading, etc.
minecraft_server_api:
  enabled: true
  api_port: 29187
  web_server_port: 29188

# --- GUI ---
# The graphical user interface is served by the central API server
# and displayed in a pywebview window.
# Set enabled: true to launch the dashboard on startup.
gui:
  enabled: true

# ===========================================================================
#  OVERLAY (CORE)
# ===========================================================================
# The built-in overlay subsystem displays text messages on stream.
# It runs as a core component, not a plugin.
overlay:
  enabled: true

  # Display mode: overwrite = replace current message; queue = line up messages
  display_mode: overwrite

  # Fade durations (milliseconds)
  fade_in: 500
  fade_out: 500

  # Circuit breaker settings
  max_fails: 3
  cooldown: 10

  # Named overlay slots (at least "default" is required)
  overlays:
    - name: "default"

  # Theme colours for the overlay windows
  theme:
    background: "#00FF00"
    text: "#ffffff"

# --- AUTO-UPDATER ---
# Checks for new versions on startup and installs them automatically.
# It is strongly recommended to keep this enabled.
# You can also check for updates manually via the API:
#   GET http://localhost:29185/api/v1/updates/check
update:
  enabled: true

  # Maximum number of update log files to keep in logs/update_logs/.
  #  0  = delete all logs after each update
  #  -1 = never delete logs
  max_update_logs: 20

# --- PLUGIN SANDBOX ---
# Restricts plugin subprocess resources to limit the impact of
# misbehaving or compromised plugins.
#
#   enabled:        true/false to enable sandboxing
#   max_memory_mb:  Maximum RAM per plugin (Linux direct / Windows job)
#   max_cpu_time:   Maximum CPU seconds per plugin (Linux only)
#   max_files:      Maximum open file descriptors (Linux only)
#   max_processes:  Maximum child processes per plugin (Linux only)
#   priority_class: Windows process priority (below_normal / idle)
plugin_sandbox:
  enabled: false
  max_memory_mb: 512
  max_cpu_time: 3600
  max_files: 256
  max_processes: 32
  priority_class: "below_normal"