<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok2Mc Launcher</title>
    <style>
        :root {
            --color-bg: #0d0d0d;
            --color-surface: #161616;
            --color-border: #2a2a2a;
            --color-text: #ececec;
            --color-text-muted: #8a8a8a;
            --color-accent: #f5c518;
            --color-accent-hover: #e6b800;
            --color-danger: #ef4444;
            --color-success: #22c55e;
            --color-warning: #f59e0b;
            --color-danger-subtle: rgba(239, 68, 68, 0.1);
            --color-success-subtle: rgba(34, 197, 94, 0.1);
            --color-accent-subtle: rgba(245, 197, 24, 0.08);
            --color-warning-subtle: rgba(245, 158, 11, 0.1);
            --radius-lg: 8px;
            --radius-xl: 12px;
            --radius-full: 999px;
            --transition-fast: 150ms ease;
            --transition-base: 200ms ease-out;
            --transition-enter: 200ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-bg);
            background-image: radial-gradient(ellipse at 50% 0%, rgba(245, 197, 24, 0.03) 0%, transparent 60%);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 480px; width: 100%; }
        .logo { text-align: center; margin-bottom: 2rem; }
        .lang-btn {
            padding: 0.3rem 0.8rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-full);
            background: transparent;
            color: var(--color-text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .lang-btn:hover { color: var(--color-text); border-color: var(--color-accent); }
        .lang-btn.active {
            background: var(--color-accent);
            border-color: var(--color-accent);
            color: var(--color-bg);
        }
        .logo h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: var(--color-accent);
            letter-spacing: -0.01em;
        }
        .logo p { color: var(--color-text-muted); font-size: 0.9rem; }

        .launcher-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }
        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .status-label { font-size: 0.9rem; color: var(--color-text-muted); }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-pill.online {
            background: var(--color-success-subtle);
            color: var(--color-success);
        }
        .status-pill.offline {
            background: var(--color-danger-subtle);
            color: var(--color-danger);
        }
        .status-pill.starting {
            background: var(--color-warning-subtle);
            color: var(--color-warning);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }
        .status-pill.online .dot {
            animation: pulse-dot 2s ease-in-out infinite;
        }
        .status-pill.starting .dot {
            animation: pulse-dot 1s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .start-btn {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--color-accent);
            color: var(--color-bg);
        }
        .start-btn:hover { background: var(--color-accent-hover); }
        .start-btn:active { transform: scale(0.98); }
        .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: var(--radius-lg);
            font-size: 0.85rem;
            text-align: center;
        }
        .message.error {
            background: var(--color-danger-subtle);
            color: var(--color-danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .message.success {
            background: var(--color-success-subtle);
            color: var(--color-success);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .message.info {
            background: var(--color-accent-subtle);
            color: var(--color-accent);
            border: 1px solid rgba(245, 197, 24, 0.15);
        }
        .hint {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: var(--radius-lg);
            background: var(--color-warning-subtle);
            border: 1px solid rgba(245, 158, 11, 0.15);
            font-size: 0.8rem;
            color: var(--color-warning);
            text-align: center;
        }
        .footer-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: 1rem;
            text-align: center;
        }
        .footer-card p { font-size: 0.8rem; color: var(--color-text-muted); opacity: 0.6; }

        .remote-btn {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            background: transparent;
            color: var(--color-text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .remote-btn:hover { color: var(--color-text); border-color: var(--color-accent); background: var(--color-accent-subtle); }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            animation: modal-enter 200ms cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes modal-enter {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .modal p {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-bottom: 1rem;
        }
        .modal label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--color-text-muted);
            margin-bottom: 0.3rem;
        }
        .modal input {
            width: 100%;
            padding: 0.55rem 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            background: var(--color-input);
            color: var(--color-text);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            transition: border-color var(--transition-fast);
        }
        .modal input:focus { outline: none; border-color: var(--color-accent); }
        .modal input::placeholder { color: var(--color-text-muted); opacity: 0.5; }
        .input-row { display: flex; gap: 0.75rem; }
        .input-row > * { flex: 1; }
        .modal-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
        .modal-actions button { flex: 1; padding: 0.6rem; border-radius: var(--radius-lg); font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; transition: all var(--transition-fast); }
        .btn-primary { background: var(--color-accent); color: var(--color-bg); }
        .btn-primary:hover { background: var(--color-accent-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: transparent; border: 1px solid var(--color-border) !important; color: var(--color-text-muted); }
        .btn-secondary:hover { color: var(--color-text); border-color: var(--color-text-muted) !important; }
        .modal-msg { font-size: 0.8rem; margin-top: 0.5rem; padding: 0.5rem; border-radius: var(--radius-lg); display: none; text-align: center; }
        .modal-msg.error { display: block; background: var(--color-danger-subtle); color: var(--color-danger); border: 1px solid rgba(239,68,68,0.2); }
        .modal-msg.success { display: block; background: var(--color-success-subtle); color: var(--color-success); border: 1px solid rgba(34,197,94,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switch" style="display:flex;gap:4px;justify-content:center;margin-bottom:1rem;">
            <button class="lang-btn" data-lang="en" onclick="I18N.setLang('en')">EN</button>
            <button class="lang-btn" data-lang="de" onclick="I18N.setLang('de')">DE</button>
        </div>
        <div class="logo">
            <h1>TikTok2Mc</h1>
            <p data-i18n="launcher.tagline"></p>
        </div>

        <div class="launcher-card">
            <div class="status-row">
                <span class="status-label" data-i18n="launcher.systemStatus"></span>
                <span id="status-pill" class="status-pill offline">
                    <span class="dot"></span>
                    <span id="status-text" data-i18n="common.offline">Offline</span>
                </span>
            </div>

            <button id="btn-start" class="start-btn" onclick="startSystem()" data-i18n="launcher.startSystem">
                Start System
            </button>

            <button id="btn-remote" class="remote-btn" onclick="openRemoteModal()">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span data-i18n="launcher.remoteConnect">Remote Connect</span>
            </button>

            <div id="message-area" style="display:none;"></div>

            <div id="api-hint" class="hint" style="display:none;" data-i18n="launcher.apiOfflineHint">
                System is not running. Start it to open the dashboard.
            </div>
        </div>

        <div class="footer-card">
            <p data-i18n="launcher.footerHint">When the system is running, the full dashboard will open automatically.</p>
        </div>
    </div>

    <div id="remote-modal" class="modal-overlay" onclick="if(event.target===this)closeRemoteModal()">
        <div class="modal">
            <h2 data-i18n="launcher.remoteConnectTitle">Connect to Remote Instance</h2>
            <p data-i18n="launcher.remoteConnectDesc">Enter the address of a remote TikTok2Mc instance to control it from here.</p>
            <label data-i18n="launcher.remoteHost">IP Address</label>
            <input id="remote-host" type="text" data-i18n-placeholder="launcher.remoteHostPlaceholder" placeholder="e.g. 192.168.1.100" autocomplete="off">
            <div class="input-row">
                <div>
                    <label data-i18n="launcher.remotePort">Port</label>
                    <input id="remote-port" type="text" value="29185" data-i18n-placeholder="launcher.remotePortPlaceholder" placeholder="29185" autocomplete="off">
                </div>
                <div>
                    <label data-i18n="launcher.remoteApiKey">API Key (optional)</label>
                    <input id="remote-apikey" type="password" data-i18n-placeholder="launcher.remoteApiKeyPlaceholder" placeholder="Leave empty if not set" autocomplete="off">
                </div>
            </div>
            <div id="remote-msg" class="modal-msg"></div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeRemoteModal()" data-i18n="common.cancel">Cancel</button>
                <button id="btn-remote-connect" class="btn-primary" onclick="connectRemote()" data-i18n="launcher.remoteConnectBtn">Connect</button>
            </div>
        </div>
    </div>

    <script src="./i18n.js?v=1"></script>
    <script>
        const API_URL = 'http://127.0.0.1:29185/api/v1/health';
        const GUI_URL = 'http://127.0.0.1:29185/gui/index.html';
        let isStarting = false;
        let shutdownPoll = null;

        function setStatus(state, text) {
            const pill = document.getElementById('status-pill');
            const label = document.getElementById('status-text');
            pill.className = 'status-pill ' + state;
            label.textContent = text;
        }

        function showMessage(msg, type) {
            const area = document.getElementById('message-area');
            area.textContent = msg;
            area.className = 'message ' + type;
            area.style.display = 'block';
            setTimeout(() => { area.style.display = 'none'; }, 6000);
        }

        function setButton(busy) {
            document.getElementById('btn-start').disabled = busy;
        }

        async function checkApi() {
            try {
                await fetch(API_URL, { method: 'GET', mode: 'cors', cache: 'no-store', signal: AbortSignal.timeout(1000) });
                return true;
            } catch (e) {
                return false;
            }
        }

        async function isShuttingDown() {
            try {
                if (typeof pywebview !== 'undefined' && pywebview.api && pywebview.api.get_shutdown_status) {
                    const s = await pywebview.api.get_shutdown_status();
                    return !!(s && s.shutting_down);
                }
            } catch (_) {}
            return false;
        }

        function setShutdownMode(active) {
            const btn = document.getElementById('btn-start');
            const hint = document.getElementById('api-hint');
            if (active) {
                btn.disabled = true;
                btn.textContent = I18N.t('launcher.startSystem');
                setStatus('starting', I18N.t('common.starting') + '...');
                hint.textContent = I18N.t('launcher.shutdownInProgress') || 'Previous system is shutting down, please wait...';
                hint.style.display = 'block';
            } else {
                hint.style.display = 'none';
            }
        }

        function startShutdownPoll() {
            if (shutdownPoll) return;
            shutdownPoll = setInterval(async () => {
                if (!(await isShuttingDown())) {
                    clearInterval(shutdownPoll);
                    shutdownPoll = null;
                    setShutdownMode(false);
                    setButton(false);
                    setStatus('offline', I18N.t('common.offline'));
                    document.getElementById('api-hint').style.display = 'block';
                }
            }, 2000);
        }

        const UPDATE_ACTIVE_PHASES = ['checking', 'downloading', 'installing'];
        const WAIT_TIMEOUT_MS = 30000;
        const UPDATE_TIMEOUT_MS = 600000;

        let guiCloseRequested = false;

        function resetStartButton() {
            setButton(false);
            document.getElementById('btn-start').textContent = I18N.t('launcher.startSystem');
        }

        function requestGuiCloseForUpdate() {
            if (guiCloseRequested) return;
            guiCloseRequested = true;
            setStatus('installing', I18N.t('launcher.updateInstalling'));
            // Give the message a beat on screen, then hand over to the
            // always-on-top update splash window (it closes itself when the
            // restarted app is back).
            setTimeout(() => {
                try {
                    if (typeof pywebview !== 'undefined' && pywebview.api && pywebview.api.close_for_update) {
                        const lang = (typeof I18N !== 'undefined' && I18N.lang) ? I18N.lang() : 'en';
                        pywebview.api.close_for_update(lang).catch(() => {});
                    } else if (typeof pywebview !== 'undefined' && pywebview.api && pywebview.api.close_app) {
                        pywebview.api.close_app().catch(() => {});
                    }
                } catch (_) {}
            }, 800);
        }

        async function getUpdateStatus() {
            try {
                if (typeof pywebview !== 'undefined' && pywebview.api && pywebview.api.get_update_status) {
                    return await pywebview.api.get_update_status();
                }
            } catch (_) {}
            return null;
        }

        function updateStatusText(s) {
            if (!s) return null;
            if (s.phase === 'checking') return I18N.t('launcher.updateChecking');
            if (s.phase === 'downloading') {
                if (typeof s.progress === 'number' && s.progress >= 0) return I18N.t('launcher.updateDownloading', { p: s.progress });
                return I18N.t('launcher.updateDownloadingWait');
            }
            if (s.phase === 'installing') return I18N.t('launcher.updateInstalling');
            if (s.phase === 'done') return I18N.t('launcher.updateRestarting');
            return null;
        }

        async function waitForApi(onReady, onUpdateError) {
            let deadline = Date.now() + WAIT_TIMEOUT_MS;
            const poll = setInterval(async () => {
                if (isStarting === false) {
                    clearInterval(poll);
                    return;
                }
                const ready = await checkApi();
                if (ready) {
                    clearInterval(poll);
                    onReady();
                    return;
                }
                const update = await getUpdateStatus();
                if (update && update.phase === 'error') {
                    clearInterval(poll);
                    isStarting = false;
                    resetStartButton();
                    setStatus('offline', I18N.t('common.offline'));
                    showMessage(I18N.t('launcher.updateFailed', { msg: update.message || '' }), 'error');
                    onUpdateError && onUpdateError();
                    return;
                }
                if (update && UPDATE_ACTIVE_PHASES.includes(update.phase)) {
                    deadline = Date.now() + UPDATE_TIMEOUT_MS;
                    const text = updateStatusText(update);
                    if (text) setStatus('starting', text);
                    if (update.phase === 'installing') requestGuiCloseForUpdate();
                } else if (update && update.phase === 'done') {
                    setStatus('starting', I18N.t('launcher.updateRestarting'));
                }
                if (Date.now() > deadline) {
                    clearInterval(poll);
                    isStarting = false;
                    resetStartButton();
                    setStatus('offline', I18N.t('common.offline'));
                    showMessage(I18N.t('launcher.timeout'), 'error');
                    onUpdateError && onUpdateError();
                }
            }, 500);
        }

        async function startSystem() {
            if (isStarting) return;
            isStarting = true;
            setButton(true);

            const btn = document.getElementById('btn-start');
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="spinner"></span> ' + I18N.t('common.starting');
            setStatus('starting', I18N.t('common.starting'));

            try {
                if (typeof pywebview === 'undefined' || !pywebview.api) {
                    showMessage(I18N.t('launcher.mustOpenViaGui'), 'error');
                    isStarting = false;
                    setButton(false);
                    btn.textContent = originalText;
                    setStatus('offline', I18N.t('common.offline'));
                    return;
                }

                const result = await pywebview.api.start_system();
                if (result === 'already_running') {
                    showMessage(I18N.t('launcher.alreadyRunning'), 'success');
                    window.location.href = GUI_URL;
                    return;
                }
                if (result === 'missing' || String(result).startsWith('missing:')) {
                    const path = String(result).replace('missing:', '');
                    showMessage(I18N.t('launcher.executableMissing', { path }), 'error');
                    isStarting = false;
                    setButton(false);
                    btn.textContent = originalText;
                    setStatus('offline', I18N.t('common.offline'));
                    return;
                }
                if (String(result).startsWith('error:')) {
                    showMessage(I18N.t('launcher.startFailed', { msg: result }), 'error');
                    isStarting = false;
                    setButton(false);
                    btn.textContent = originalText;
                    setStatus('offline', I18N.t('common.offline'));
                    return;
                }

                waitForApi(() => {
                    isStarting = false;
                    showMessage(I18N.t('launcher.started'), 'success');
                    setTimeout(() => { window.location.href = GUI_URL; }, 600);
                });
            } catch (e) {
                showMessage(I18N.t('launcher.errorPrefix', { msg: e.message || e }), 'error');
                isStarting = false;
                setButton(false);
                btn.textContent = originalText;
                setStatus('offline', I18N.t('common.offline'));
            }
        }

        // Initial check — shutdown-aware
        (async function() {
            // During a previous shutdown the API may still respond briefly.
            // Check shutdown state first to avoid connecting to a dying instance.
            if (await isShuttingDown()) {
                setShutdownMode(true);
                startShutdownPoll();
                return;
            }
            const ready = await checkApi();
            if (ready) {
                setStatus('online', I18N.t('common.running'));
                window.location.href = GUI_URL;
            } else {
                document.getElementById('api-hint').style.display = 'block';
            }
        })();

        document.addEventListener('i18n:changed', () => {
            I18N.apply();
            if (isStarting) {
                setStatus('starting', I18N.t('common.starting'));
            } else {
                const ready = document.getElementById('status-pill').classList.contains('online');
                setStatus(ready ? 'online' : 'offline', ready ? I18N.t('common.running') : I18N.t('common.offline'));
            }
            const btn = document.getElementById('btn-start');
            if (!btn.disabled) {
                btn.textContent = I18N.t('launcher.startSystem');
            }
            const remoteBtn = document.getElementById('btn-remote');
            remoteBtn.lastElementChild.textContent = I18N.t('launcher.remoteConnect');
            const current = I18N.lang();
            document.querySelectorAll('.lang-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === current);
            });
        });

        // Initial language button highlighting
        const currentLang = I18N.lang();
        document.querySelectorAll('.lang-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.lang === currentLang);
        });
        I18N.apply();

        /* ─── Remote Connect ─── */
        const REMOTE_STORAGE_KEY = 'tiktok2mc_remote';

        function openRemoteModal() {
            document.getElementById('remote-modal').classList.add('open');
            const msg = document.getElementById('remote-msg');
            msg.className = 'modal-msg';
            msg.textContent = '';
            try {
                const saved = JSON.parse(localStorage.getItem(REMOTE_STORAGE_KEY) || '{}');
                if (saved.host) document.getElementById('remote-host').value = saved.host;
                if (saved.port) document.getElementById('remote-port').value = saved.port;
                if (saved.apiKey) document.getElementById('remote-apikey').value = saved.apiKey;
            } catch (_) {}
            document.getElementById('remote-host').focus();
        }

        function closeRemoteModal() {
            document.getElementById('remote-modal').classList.remove('open');
        }

        async function connectRemote() {
            const host = document.getElementById('remote-host').value.trim();
            const port = document.getElementById('remote-port').value.trim() || '29185';
            const apiKey = document.getElementById('remote-apikey').value.trim();
            const msg = document.getElementById('remote-msg');
            const btn = document.getElementById('btn-remote-connect');

            if (!host) {
                msg.className = 'modal-msg error';
                msg.textContent = I18N.t('launcher.remoteInvalidHost');
                return;
            }

            btn.disabled = true;
            btn.textContent = I18N.t('launcher.remoteConnecting');
            msg.className = 'modal-msg';
            msg.textContent = '';

            try { localStorage.setItem(REMOTE_STORAGE_KEY, JSON.stringify({ host, port, apiKey })); } catch (_) {}

            if (typeof pywebview !== 'undefined' && pywebview.api && pywebview.api.connect_remote) {
                const result = await pywebview.api.connect_remote(host, port, apiKey);
                if (result === 'ok') return;
                msg.className = 'modal-msg error';
                msg.textContent = I18N.t('launcher.remoteFailed', { msg: String(result).replace('error:', '') });
                btn.disabled = false;
                btn.textContent = I18N.t('launcher.remoteConnectBtn');
                return;
            }

            const baseUrl = 'http://' + host + ':' + port;
            try {
                const headers = {};
                if (apiKey) headers['X-API-Key'] = apiKey;
                const res = await fetch(baseUrl + '/api/v1/health', {
                    method: 'GET',
                    cache: 'no-store',
                    headers: headers,
                    signal: AbortSignal.timeout(5000)
                });
                if (!res.ok && res.status !== 401) {
                    throw new Error('HTTP ' + res.status);
                }
                const dashUrl = baseUrl + '/gui/index.html' + (apiKey ? '?key=' + encodeURIComponent(apiKey) : '');
                window.location.href = dashUrl;
            } catch (e) {
                msg.className = 'modal-msg error';
                msg.textContent = I18N.t('launcher.remoteFailed', { msg: e.message || e });
                btn.disabled = false;
                btn.textContent = I18N.t('launcher.remoteConnectBtn');
            }
        }

        document.getElementById('remote-host').addEventListener('keydown', function(e) { if (e.key === 'Enter') connectRemote(); });
        document.getElementById('remote-port').addEventListener('keydown', function(e) { if (e.key === 'Enter') connectRemote(); });
        document.getElementById('remote-apikey').addEventListener('keydown', function(e) { if (e.key === 'Enter') connectRemote(); });
    </script>
</body>
</html>
