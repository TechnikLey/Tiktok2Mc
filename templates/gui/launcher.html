<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok2Mc Launcher</title>
    <style>
        :root {
            --bg: #0f1117;
            --card: #181b21;
            --border: #2a2e36;
            --text: #e4e6eb;
            --muted: #9ca3af;
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --danger: #f87171;
            --success: #34d399;
            --warning: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            max-width: 520px;
            width: 100%;
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .logo p {
            color: var(--muted);
            font-size: 0.9rem;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .status-label {
            font-size: 0.9rem;
            color: var(--muted);
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-pill.online {
            background: rgba(52, 211, 153, 0.15);
            color: var(--success);
        }
        .status-pill.offline {
            background: rgba(248, 113, 113, 0.15);
            color: var(--danger);
        }
        .status-pill.starting {
            background: rgba(251, 191, 36, 0.15);
            color: var(--warning);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        .btn {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            margin-top: 0.5rem;
        }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
        }
        .message.error {
            background: rgba(248, 113, 113, 0.1);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.2);
        }
        .message.success {
            background: rgba(52, 211, 153, 0.1);
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.2);
        }
        .message.info {
            background: rgba(96, 165, 250, 0.1);
            color: var(--accent);
            border: 1px solid rgba(96, 165, 250, 0.2);
        }
        .hint {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            background: rgba(251, 191, 36, 0.05);
            border: 1px solid rgba(251, 191, 36, 0.15);
            font-size: 0.8rem;
            color: var(--warning);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>TikTok2Mc</h1>
            <p>Connect your TikTok Live stream to Minecraft</p>
        </div>

        <div class="card">
            <div class="status-row">
                <span class="status-label">System Status</span>
                <span id="status-pill" class="status-pill offline">
                    <span class="dot"></span>
                    <span id="status-text">Offline</span>
                </span>
            </div>

            <button id="btn-start-api" class="btn btn-primary" onclick="startApi()">
                Start API Server
            </button>

            <button id="btn-start-full" class="btn btn-secondary" onclick="startFullSystem()">
                Start Full System
            </button>

            <div id="message-area" style="display:none;"></div>

            <div id="api-hint" class="hint" style="display:none;">
                API server is not running. Start it to enable the dashboard.
            </div>
        </div>

        <div class="card" style="text-align:center; padding:1rem;">
            <p style="font-size:0.8rem; color:var(--muted);">
                When the API server is running, the full dashboard will open automatically.
            </p>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:29185/api/v1/health';
        const GUI_URL = 'http://127.0.0.1:29185/gui/index.html';
        let pollInterval = null;
        let isStarting = false;

        function setStatus(state, text) {
            const pill = document.getElementById('status-pill');
            const label = document.getElementById('status-text');
            pill.className = 'status-pill ' + state;
            label.textContent = text;
        }

        function showMessage(msg, type) {
            const area = document.getElementById('message-area');
            area.textContent = msg;
            area.className = 'message ' + type;
            area.style.display = 'block';
            setTimeout(() => { area.style.display = 'none'; }, 6000);
        }

        function setButtons(busy) {
            document.getElementById('btn-start-api').disabled = busy;
            document.getElementById('btn-start-full').disabled = busy;
        }

        async function checkApi() {
            try {
                await fetch(API_URL, { method: 'GET', mode: 'cors', cache: 'no-store' });
                return true;
            } catch (e) {
                return false;
            }
        }

        async function waitForApi(maxAttempts, onReady) {
            let attempts = 0;
            const poll = setInterval(async () => {
                if (isStarting === false) {
                    clearInterval(poll);
                    return;
                }
                const ready = await checkApi();
                attempts++;
                if (ready) {
                    clearInterval(poll);
                    onReady();
                } else if (attempts > maxAttempts) {
                    clearInterval(poll);
                    isStarting = false;
                    setButtons(false);
                    setStatus('offline', 'Offline');
                    showMessage('Server did not start within timeout. Check logs.', 'error');
                }
            }, 500);
        }

        async function startApi() {
            if (isStarting) return;
            isStarting = true;
            setButtons(true);

            const btn = document.getElementById('btn-start-api');
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="spinner"></span> Starting API...';
            setStatus('starting', 'Starting API...');

            try {
                // Check if pywebview API is available
                if (typeof pywebview === 'undefined' || !pywebview.api) {
                    showMessage('This page must be opened via the TikTok2Mc GUI application.', 'error');
                    isStarting = false;
                    setButtons(false);
                    btn.textContent = originalText;
                    setStatus('offline', 'Offline');
                    return;
                }

                const result = await pywebview.api.start_api();
                if (result === 'already_running') {
                    showMessage('API is already running', 'success');
                    window.location.href = GUI_URL;
                    return;
                }
                if (result === 'missing' || String(result).startsWith('missing:')) {
                    showMessage('Application executable not found. Run a build first.', 'error');
                    isStarting = false;
                    setButtons(false);
                    btn.textContent = originalText;
                    setStatus('offline', 'Offline');
                    return;
                }
                if (String(result).startsWith('error:')) {
                    showMessage('Failed to start: ' + result, 'error');
                    isStarting = false;
                    setButtons(false);
                    btn.textContent = originalText;
                    setStatus('offline', 'Offline');
                    return;
                }

                // Poll until ready
                waitForApi(40, () => {
                    isStarting = false;
                    showMessage('API server started', 'success');
                    setTimeout(() => { window.location.href = GUI_URL; }, 600);
                });
            } catch (e) {
                showMessage('Error: ' + (e.message || e), 'error');
                isStarting = false;
                setButtons(false);
                btn.textContent = originalText;
                setStatus('offline', 'Offline');
            }
        }

        async function startFullSystem() {
            if (isStarting) return;
            isStarting = true;
            setButtons(true);

            const btn = document.getElementById('btn-start-full');
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="spinner"></span> Starting Full System...';
            setStatus('starting', 'Starting Full System...');

            try {
                if (typeof pywebview === 'undefined' || !pywebview.api) {
                    showMessage('This page must be opened via the TikTok2Mc GUI application.', 'error');
                    isStarting = false;
                    setButtons(false);
                    btn.textContent = originalText;
                    setStatus('offline', 'Offline');
                    return;
                }

                const result = await pywebview.api.start_full_system();
                if (result === 'already_running') {
                    showMessage('Full system is already running', 'success');
                    window.location.href = GUI_URL;
                    return;
                }
                if (result === 'missing' || String(result).startsWith('missing:')) {
                    showMessage('Application executable not found. Run a build first.', 'error');
                    isStarting = false;
                    setButtons(false);
                    btn.textContent = originalText;
                    setStatus('offline', 'Offline');
                    return;
                }
                if (String(result).startsWith('error:')) {
                    showMessage('Failed to start: ' + result, 'error');
                    isStarting = false;
                    setButtons(false);
                    btn.textContent = originalText;
                    setStatus('offline', 'Offline');
                    return;
                }

                waitForApi(60, () => {
                    isStarting = false;
                    showMessage('Full system started', 'success');
                    setTimeout(() => { window.location.href = GUI_URL; }, 600);
                });
            } catch (e) {
                showMessage('Error: ' + (e.message || e), 'error');
                isStarting = false;
                setButtons(false);
                btn.textContent = originalText;
                setStatus('offline', 'Offline');
            }
        }

        // Initial check
        checkApi().then(ready => {
            if (ready) {
                setStatus('online', 'Running');
                window.location.href = GUI_URL;
            } else {
                document.getElementById('api-hint').style.display = 'block';
            }
        });
    </script>
</body>
</html>
