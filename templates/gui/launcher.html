<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok2Mc Launcher</title>
    <style>
        :root {
            --color-bg: #0d0d0d;
            --color-surface: #161616;
            --color-border: #2a2a2a;
            --color-text: #ececec;
            --color-text-muted: #8a8a8a;
            --color-accent: #f5c518;
            --color-accent-hover: #e6b800;
            --color-danger: #ef4444;
            --color-success: #22c55e;
            --color-warning: #f59e0b;
            --color-danger-subtle: rgba(239, 68, 68, 0.1);
            --color-success-subtle: rgba(34, 197, 94, 0.1);
            --color-accent-subtle: rgba(245, 197, 24, 0.08);
            --color-warning-subtle: rgba(245, 158, 11, 0.1);
            --radius-lg: 8px;
            --radius-xl: 12px;
            --radius-full: 999px;
            --transition-fast: 150ms ease;
            --transition-base: 200ms ease-out;
            --transition-enter: 200ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-bg);
            background-image: radial-gradient(ellipse at 50% 0%, rgba(245, 197, 24, 0.03) 0%, transparent 60%);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 480px; width: 100%; }
        .logo { text-align: center; margin-bottom: 2rem; }
        .lang-btn {
            padding: 0.3rem 0.8rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-full);
            background: transparent;
            color: var(--color-text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .lang-btn:hover { color: var(--color-text); border-color: var(--color-accent); }
        .lang-btn.active {
            background: var(--color-accent);
            border-color: var(--color-accent);
            color: var(--color-bg);
        }
        .logo h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: var(--color-accent);
            letter-spacing: -0.01em;
        }
        .logo p { color: var(--color-text-muted); font-size: 0.9rem; }

        .launcher-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }
        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .status-label { font-size: 0.9rem; color: var(--color-text-muted); }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-pill.online {
            background: var(--color-success-subtle);
            color: var(--color-success);
        }
        .status-pill.offline {
            background: var(--color-danger-subtle);
            color: var(--color-danger);
        }
        .status-pill.starting {
            background: var(--color-warning-subtle);
            color: var(--color-warning);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }
        .status-pill.online .dot {
            animation: pulse-dot 2s ease-in-out infinite;
        }
        .status-pill.starting .dot {
            animation: pulse-dot 1s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .start-btn {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--color-accent);
            color: var(--color-bg);
        }
        .start-btn:hover { background: var(--color-accent-hover); }
        .start-btn:active { transform: scale(0.98); }
        .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: var(--radius-lg);
            font-size: 0.85rem;
            text-align: center;
        }
        .message.error {
            background: var(--color-danger-subtle);
            color: var(--color-danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .message.success {
            background: var(--color-success-subtle);
            color: var(--color-success);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .message.info {
            background: var(--color-accent-subtle);
            color: var(--color-accent);
            border: 1px solid rgba(245, 197, 24, 0.15);
        }
        .hint {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: var(--radius-lg);
            background: var(--color-warning-subtle);
            border: 1px solid rgba(245, 158, 11, 0.15);
            font-size: 0.8rem;
            color: var(--color-warning);
            text-align: center;
        }
        .footer-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: 1rem;
            text-align: center;
        }
        .footer-card p { font-size: 0.8rem; color: var(--color-text-muted); opacity: 0.6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switch" style="display:flex;gap:4px;justify-content:center;margin-bottom:1rem;">
            <button class="lang-btn" data-lang="en" onclick="I18N.setLang('en')">EN</button>
            <button class="lang-btn" data-lang="de" onclick="I18N.setLang('de')">DE</button>
        </div>
        <div class="logo">
            <h1>TikTok2Mc</h1>
            <p data-i18n="launcher.tagline"></p>
        </div>

        <div class="launcher-card">
            <div class="status-row">
                <span class="status-label" data-i18n="launcher.systemStatus"></span>
                <span id="status-pill" class="status-pill offline">
                    <span class="dot"></span>
                    <span id="status-text" data-i18n="common.offline">Offline</span>
                </span>
            </div>

            <button id="btn-start" class="start-btn" onclick="startSystem()" data-i18n="launcher.startSystem">
                Start System
            </button>

            <div id="message-area" style="display:none;"></div>

            <div id="api-hint" class="hint" style="display:none;" data-i18n="launcher.apiOfflineHint">
                System is not running. Start it to open the dashboard.
            </div>
        </div>

        <div class="footer-card">
            <p data-i18n="launcher.footerHint">When the system is running, the full dashboard will open automatically.</p>
        </div>
    </div>

    <script src="./i18n.js?v=1"></script>
    <script>
        const API_URL = 'http://127.0.0.1:29185/api/v1/health';
        const GUI_URL = 'http://127.0.0.1:29185/gui/index.html';
        let isStarting = false;

        function setStatus(state, text) {
            const pill = document.getElementById('status-pill');
            const label = document.getElementById('status-text');
            pill.className = 'status-pill ' + state;
            label.textContent = text;
        }

        function showMessage(msg, type) {
            const area = document.getElementById('message-area');
            area.textContent = msg;
            area.className = 'message ' + type;
            area.style.display = 'block';
            setTimeout(() => { area.style.display = 'none'; }, 6000);
        }

        function setButton(busy) {
            document.getElementById('btn-start').disabled = busy;
        }

        async function checkApi() {
            try {
                await fetch(API_URL, { method: 'GET', mode: 'cors', cache: 'no-store' });
                return true;
            } catch (e) {
                return false;
            }
        }

        async function waitForApi(maxAttempts, onReady) {
            let attempts = 0;
            const poll = setInterval(async () => {
                if (isStarting === false) {
                    clearInterval(poll);
                    return;
                }
                const ready = await checkApi();
                attempts++;
                if (ready) {
                    clearInterval(poll);
                    onReady();
                } else if (attempts > maxAttempts) {
                    clearInterval(poll);
                    isStarting = false;
                    setButton(false);
                    setStatus('offline', I18N.t('common.offline'));
                    showMessage(I18N.t('launcher.timeout'), 'error');
                }
            }, 500);
        }

        async function startSystem() {
            if (isStarting) return;
            isStarting = true;
            setButton(true);

            const btn = document.getElementById('btn-start');
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="spinner"></span> ' + I18N.t('common.starting');
            setStatus('starting', I18N.t('common.starting'));

            try {
                if (typeof pywebview === 'undefined' || !pywebview.api) {
                    showMessage(I18N.t('launcher.mustOpenViaGui'), 'error');
                    isStarting = false;
                    setButton(false);
                    btn.textContent = originalText;
                    setStatus('offline', I18N.t('common.offline'));
                    return;
                }

                const result = await pywebview.api.start_system();
                if (result === 'already_running') {
                    showMessage(I18N.t('launcher.alreadyRunning'), 'success');
                    window.location.href = GUI_URL;
                    return;
                }
                if (result === 'missing' || String(result).startsWith('missing:')) {
                    const path = String(result).replace('missing:', '');
                    showMessage(I18N.t('launcher.executableMissing', { path }), 'error');
                    isStarting = false;
                    setButton(false);
                    btn.textContent = originalText;
                    setStatus('offline', I18N.t('common.offline'));
                    return;
                }
                if (String(result).startsWith('error:')) {
                    showMessage(I18N.t('launcher.startFailed', { msg: result }), 'error');
                    isStarting = false;
                    setButton(false);
                    btn.textContent = originalText;
                    setStatus('offline', I18N.t('common.offline'));
                    return;
                }

                waitForApi(60, () => {
                    isStarting = false;
                    showMessage(I18N.t('launcher.started'), 'success');
                    setTimeout(() => { window.location.href = GUI_URL; }, 600);
                });
            } catch (e) {
                showMessage(I18N.t('launcher.errorPrefix', { msg: e.message || e }), 'error');
                isStarting = false;
                setButton(false);
                btn.textContent = originalText;
                setStatus('offline', I18N.t('common.offline'));
            }
        }

        // Initial check
        checkApi().then(ready => {
            if (ready) {
                setStatus('online', I18N.t('common.running'));
                window.location.href = GUI_URL;
            } else {
                document.getElementById('api-hint').style.display = 'block';
            }
        });

        document.addEventListener('i18n:changed', () => {
            I18N.apply();
            if (isStarting) {
                setStatus('starting', I18N.t('common.starting'));
            } else {
                const ready = document.getElementById('status-pill').classList.contains('online');
                setStatus(ready ? 'online' : 'offline', ready ? I18N.t('common.running') : I18N.t('common.offline'));
            }
            const btn = document.getElementById('btn-start');
            if (!btn.disabled) {
                btn.textContent = I18N.t('launcher.startSystem');
            }
            const current = I18N.lang();
            document.querySelectorAll('.lang-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === current);
            });
        });

        // Initial language button highlighting
        const currentLang = I18N.lang();
        document.querySelectorAll('.lang-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.lang === currentLang);
        });
        I18N.apply();
    </script>
</body>
</html>
