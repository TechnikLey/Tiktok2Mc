<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Search Database</h1>

    <form method="POST">
        <div class="field-group">
            <label for="search">Search term:</label>
            <input type="text" id="search" name="search" value="{{ search_query }}">
        </div>

        <div class="field-group">
            <label for="field">Field:</label>
            <select name="field" id="field">
                <option value="name" {% if field=="name" %}selected{% endif %}>Name</option>
                <option value="coins" {% if field=="coins" %}selected{% endif %}>Coins</option>
                <option value="id" {% if field=="id" %}selected{% endif %}>ID</option>
            </select>
        </div>

        <input type="submit" value="Search" class="btn-save">
    </form>

    <a href="/" class="btn-back">Back to Menu</a>

    <hr>

    {% if results %}
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Coins</th>
                    <th>ID</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in results %}
                    <tr>
                        <td>{{ entry.name }}</td>
                        <td>{{ entry.coins }}</td>
                        <td>{{ entry.id }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p class="comment top-comment">No results found.</p>
    {% endif %}
</body>
</html>
