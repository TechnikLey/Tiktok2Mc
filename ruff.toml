#   ISC001           implicit string concatenation
#   UP006/8/9/17/29/34/35/37/45   type & annotation modernization
#   RUF100           stale # noqa directives
#   SIM114           identical if-branches (combine with `or`)
#   BLE001 / S110    broad-except and try-except-pass policy — enforced
#                    via per-file-ignores below (error-boundary architecture)
select = [
    "F",
    "I001",
    "ISC001",
    "UP006",
    "UP008",
    "UP009",
    "UP017",
    "UP029",
    "UP034",
    "UP035",
    "UP037",
    "UP045",
    "RUF100",
