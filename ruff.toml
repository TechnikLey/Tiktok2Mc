# F841: unused local variables — kept off because several sites are
# deliberate side-effect calls (overlay singleton init in overlay.py,
# pywebview window creation in base_plugin.py) and test setup helpers.
# Re-enable after those are refactored.
ignore = ["F841"]

# Error-boundary architecture: the app isolates failure behind deliberate
# catch-all handlers (subprocess supervision, plugin/hook execution, worker
# loops, GUI/pywebview lifecycle, atexit cleanup, logging, health/overlay
# dispatch, config/backup robustness). Those files are exempted per-file
# below; every other `except Exception` / `except: pass` in the codebase
# must be narrowed to specific exceptions or carry an inline `# noqa` with
# a justification. See AGENTS.md §7.1.
[lint.per-file-ignores]
