name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Run Tests
        run: pytest tests/ -v --tb=short

      - name: Check mca-spec.json is up to date
        run: |
          python build.py spec
          git diff --exit-code mca-language-server/mca-spec.json ||
            (echo "::error::mca-spec.json is stale — run 'python build.py spec' and commit the result." && exit 1)

      - name: Run Tests (with warnings)
        run: pytest tests/ -W error::UserWarning --tb=short
        continue-on-error: true

  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        # ruff is a local-only dev tool (not in requirements.txt); pinned for
        # reproducible CI runs. Config lives in ruff.toml.
        run: pip install ruff

      - name: ruff format --check
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: eslint (GUI)
        working-directory: templates/gui
        run: npm ci && npx eslint .

  gui-tests:
    name: GUI Tests (vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: templates/gui/package-lock.json

      - name: npm ci
        working-directory: templates/gui
        run: npm ci

      - name: Run GUI tests
        working-directory: templates/gui
        run: npm test
