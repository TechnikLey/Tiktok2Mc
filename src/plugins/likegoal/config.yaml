# ==========================================
# Like Goal Plugin — Configuration
# ==========================================
# Fully decoupled like-goal tracker with milestone progression.
# Publishes events to the EventBus; consumers react via API.

display_text: "Like Goal"
initial_goal: 100000
goal_multiplier: 2

signal_on:
  - "milestone"
  - "progress"

theme:
  background: "#000000"
  text: "#ffffff"
  accent: "#1db954"
  accent2: "#1ed760"
  danger: "#ff0000"
